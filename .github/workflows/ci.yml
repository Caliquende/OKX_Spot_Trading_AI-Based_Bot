name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OKX_API_KEY: dummy_key
      OKX_SECRET: dummy_secret
      OKX_PASSPHRASE: dummy_passphrase

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov flake8

      - name: Lint with flake8
        run: |
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m flake8 . --exit-zero

      - name: Test with pytest
        env:
          PYTHONPATH: .
        run: >
          python -m pytest
          --cov=analysis
          --cov=config
          --cov=core
          --cov=db
          --cov=indicators
          --cov=reporting
          --cov=strategy
          --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false

      # Security scanning.
      - name: Run Bandit security scan
        run: |
          python -m pip install bandit[toml]
          bandit -r . -f screen --severity-level medium --confidence-level medium -x ./.venv,./venv,./env,./.pytest_cache,./scratch || true

      - name: Run pip-audit dependency scan
        run: |
          python -m pip install pip-audit
          pip-audit || true
