# TR: CodeQL — GitHub'ın statik analiz motoru. Python kodunda güvenlik açıklarını tarar.
# EN: CodeQL — GitHub's static analysis engine. Scans Python code for security vulnerabilities.
name: "CodeQL Analysis"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # TR: Her Pazartesi 06:00 UTC'de zamanlanmış çalışır.
  # EN: Runs on a scheduled basis every Monday at 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ "python" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
